<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 560" width="1080" height="560" role="img" aria-label="Architecture: a LangGraph agent in FastAPI writes every step to a SQLite trace and streams it over SSE to a TypeScript GraphQL gateway and React console; fault injection and replay evaluation run against the same graph."><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9198a1"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3987e5"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d95926"/></marker></defs><rect width="1080" height="560" rx="14" fill="#0d1117" stroke="#30363d"/><text x="32" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#e6edf3" text-anchor="start">One agent graph, traced, streamed, gated and replayed</text><text x="32" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#9198a1" text-anchor="start">Every step is written to the trace before it is streamed. Replay re-runs recorded inputs against a candidate build.</text><rect x="28" y="92" width="640" height="300" rx="12" fill="#161b22" stroke="none" stroke-width="0"/><text x="44" y="114" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#9198a1" text-anchor="start">PYTHON  ·  FastAPI + LangGraph</text><rect x="48" y="140" width="136" height="76" rx="10" fill="#13263d" stroke="#3987e5" stroke-width="1.5"/><text x="116.0" y="174.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="650" fill="#e6edf3" text-anchor="middle">classify</text><text x="116.0" y="193.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9198a1" text-anchor="middle">TF-IDF + LR router</text><text x="116.0" y="209.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9198a1" text-anchor="middle">+ priority model</text><rect x="200" y="140" width="136" height="76" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><text x="268.0" y="174.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="650" fill="#e6edf3" text-anchor="middle">retrieve</text><text x="268.0" y="193.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9198a1" text-anchor="middle">Chroma: past tickets</text><text x="268.0" y="209.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9198a1" text-anchor="middle">+ synthetic KB</text><rect x="352" y="140" width="136" height="76" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><text x="420.0" y="174.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="650" fill="#e6edf3" text-anchor="middle">draft</text><text x="420.0" y="193.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9198a1" text-anchor="middle">offline extractive</text><text x="420.0" y="209.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9198a1" text-anchor="middle">(Groq: pluggable)</text><rect x="504" y="140" width="136" height="76" rx="10" fill="#0f2e23" stroke="#199e70" stroke-width="1.5"/><text x="572.0" y="174.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="650" fill="#e6edf3" text-anchor="middle">gate</text><text x="572.0" y="193.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9198a1" text-anchor="middle">auto / approve /</text><text x="572.0" y="209.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9198a1" text-anchor="middle">escalate</text><line x1="184" y1="178.0" x2="196" y2="178.0" stroke="#9198a1" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ar)"/><line x1="336" y1="178.0" x2="348" y2="178.0" stroke="#9198a1" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ar)"/><line x1="488" y1="178.0" x2="500" y2="178.0" stroke="#9198a1" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ar)"/><path d="M116,220 L116,236 L572,236 L572,220" fill="none" stroke="#9198a1" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"/><text x="344" y="231" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#9198a1" text-anchor="middle">every node writes a step (input, output, error, latency)</text><rect x="48" y="262" width="280" height="60" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5" stroke-dasharray="5 4"/><text x="188.0" y="288.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="650" fill="#e6edf3" text-anchor="middle">fault injector + guards</text><text x="188.0" y="307.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9198a1" text-anchor="middle">5 faults · validators on each node</text><rect x="360" y="262" width="280" height="60" rx="10" fill="#3a1d12" stroke="#d95926" stroke-width="1.5"/><text x="500.0" y="288.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="650" fill="#e6edf3" text-anchor="middle">SQLite trace</text><text x="500.0" y="307.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9198a1" text-anchor="middle">runs + steps · reconstructable</text><line x1="188" y1="258" x2="188" y2="240" stroke="#d95926" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 4" marker-end="url(#arb)"/><line x1="500" y1="240" x2="500" y2="258" stroke="#9198a1" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ar)"/><rect x="48" y="340" width="592" height="40" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><text x="344.0" y="365.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="650" fill="#e6edf3" text-anchor="middle">replay harness: recorded runs × candidate build, mocked writes, paired tests</text><rect x="712" y="140" width="160" height="96" rx="10" fill="#13263d" stroke="#3987e5" stroke-width="1.5"/><text x="792.0" y="184.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="650" fill="#e6edf3" text-anchor="middle">GraphQL gateway</text><text x="792.0" y="203.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9198a1" text-anchor="middle">Node.js · TypeScript</text><text x="792.0" y="219.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9198a1" text-anchor="middle">graphql-yoga</text><rect x="900" y="140" width="160" height="96" rx="10" fill="#13263d" stroke="#3987e5" stroke-width="1.5"/><text x="980.0" y="184.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="650" fill="#e6edf3" text-anchor="middle">React console</text><text x="980.0" y="203.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9198a1" text-anchor="middle">live trace</text><text x="980.0" y="219.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9198a1" text-anchor="middle">approve / reject</text><line x1="640" y1="178" x2="708" y2="178" stroke="#9198a1" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ar)"/><text x="674" y="168" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#9198a1" text-anchor="middle">SSE</text><line x1="872" y1="178" x2="896" y2="178" stroke="#9198a1" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ar)"/><text x="884" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#9198a1" text-anchor="middle">subscription</text><path d="M980,236 C980,292 760,292 700,292 L644,292" fill="none" stroke="#9198a1" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ar)"/><text x="830" y="286" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#9198a1" text-anchor="middle">human decision → trace</text><rect x="600" y="420" width="460" height="96" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><text x="830.0" y="464.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="650" fill="#e6edf3" text-anchor="middle">data</text><text x="830.0" y="483.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9198a1" text-anchor="middle">16,335 English support tickets (CC BY-NC 4.0, likely synthetic)</text><text x="830.0" y="499.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9198a1" text-anchor="middle">grouped split: 8,389 paraphrase families never cross train/test</text><path d="M600,468 L344,468 L344,384" fill="none" stroke="#9198a1" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3" marker-end="url(#ar)"/><text x="470" y="460" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#9198a1" text-anchor="middle">train / replay set</text></svg>